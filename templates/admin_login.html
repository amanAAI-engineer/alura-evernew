{% extends "base.html" %}{% block title %}Admin login{% endblock %}
{% block content %}<section class="sec" style="min-height:60vh"><div class="wrap" style="max-width:420px"><h1 class="h2" style="margin-bottom:16px">Admin login</h1>
<form method="post" class="card" style="display:grid;gap:14px"><label>Password<input type="password" name="password" autofocus required></label>{% if error %}<div class="err">{{error}}</div>{% endif %}<button class="btn solid">Sign in</button></form></div></section>{% endblock %}
